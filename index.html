<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#123a34" />
  <title>أثر | منصة بناء الاستراتيجية والأداء v2.1</title>
  <style>
:root{
  --bg:#f4f7f6;
  --surface:#ffffff;
  --surface-2:#edf3f1;
  --ink:#172321;
  --muted:#667672;
  --line:#dce6e3;
  --primary:#123a34;
  --primary-2:#1e5a50;
  --accent:#c89b46;
  --danger:#a83a3a;
  --warning:#b66a15;
  --success:#2f7d5f;
  --shadow:0 18px 50px rgba(18,58,52,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Tahoma","Arial",sans-serif;
  line-height:1.7;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,#123a34,#0d2d28);
  color:#fff;
  padding:22px 18px;
  position:sticky;top:0;height:100vh;overflow:auto;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#e0be77);color:#17352f;display:grid;place-items:center;font-weight:900;font-size:24px}
.brand h1{margin:0;font-size:22px}.brand p{margin:0;color:#cfe0dc;font-size:12px}
.plan-switcher{padding:18px 8px 8px}.plan-switcher label{font-size:12px;color:#cfe0dc}
.plan-switcher select{width:100%;margin-top:6px;background:#fff;color:#17352f;border:none;border-radius:12px;padding:10px}
.switch-actions{display:flex;gap:8px;margin-top:8px}
.mini-btn,.footer-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;border-radius:10px;padding:8px 10px;flex:1}
.mini-btn.ghost,.footer-btn.ghost{background:transparent}
.progress-card{margin:12px 8px;background:rgba(255,255,255,.09);padding:14px;border-radius:14px}
.progress-head{display:flex;justify-content:space-between}.progress-track{height:7px;background:rgba(255,255,255,.14);border-radius:99px;margin:10px 0;overflow:hidden}
.progress-track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f0d39b);border-radius:99px}
.progress-card small{color:#cfe0dc}
.stage-nav{padding:8px}
.stage-group-title{font-size:11px;color:#9fc0b8;padding:14px 10px 5px}
.stage-item{
  width:100%;border:none;background:transparent;color:#dcece8;border-radius:12px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;text-align:right;margin:2px 0
}
.stage-item:hover,.stage-item.active{background:rgba(255,255,255,.12);color:#fff}
.stage-item .num{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.10);display:grid;place-items:center;font-size:12px}
.stage-item.done .num{background:var(--accent);color:#14352f}
.stage-item small{margin-right:auto;color:#9fc0b8}
.sidebar-footer{padding:10px 8px;display:grid;gap:8px}
.file-label{text-align:center;display:block}
.main{min-width:0}
.topbar{
  position:sticky;top:0;z-index:10;background:rgba(244,247,246,.92);backdrop-filter:blur(14px);
  padding:18px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between
}
.eyebrow{font-size:12px;color:var(--primary-2);font-weight:700}.topbar h2{margin:0;font-size:24px}
.top-actions{display:flex;align-items:center;gap:10px}.save-state{font-size:12px;color:var(--success)}
.btn{border:none;border-radius:12px;padding:10px 15px;font-weight:700}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--line)}
.btn.danger{background:#fff1f1;color:var(--danger);border:1px solid #f0caca}
.icon-btn{border:none;background:transparent;font-size:22px;color:inherit}
.content{padding:28px;max-width:1500px;margin:auto}
.hero{
  background:linear-gradient(135deg,#123a34,#1b5a50);
  color:#fff;border-radius:26px;padding:28px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.5fr .7fr;gap:24px
}
.hero h3{font-size:30px;margin:6px 0}.hero p{color:#d5e5e1;max-width:800px}.hero-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:rgba(255,255,255,.10);padding:16px;border-radius:16px}.stat-box strong{display:block;font-size:26px}
.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 30px rgba(18,58,52,.05)}
.card h3,.card h4{margin-top:0}.card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
.section-title h3{font-size:26px;margin:0}.section-title p{margin:4px 0 0;color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin-top:5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}
.role-team{background:#dceeff!important}.role-org{background:#fff2bf!important}.role-asked{background:#e2f2d9!important}.role-auto{background:#eee2ff!important}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.legend span{padding:5px 9px;border-radius:99px;font-size:11px;border:1px solid #00000012}.legend .team{background:#dceeff}.legend .org{background:#fff2bf}.legend .asked{background:#e2f2d9}.legend .auto{background:#eee2ff}

.input,textarea,select.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:3px solid rgba(30,90,80,.12);border-color:var(--primary-2)}
.hint{font-size:12px;color:var(--muted)}
.stage-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.callout{background:#f3f8f6;border-right:4px solid var(--primary-2);padding:14px 16px;border-radius:12px;color:#35504a}
.callout.warning{background:#fff8ef;border-right-color:var(--warning)}
.callout.success{background:#eff9f4;border-right-color:var(--success)}
.score-wrap{display:flex;align-items:center;gap:16px}.score-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--success) var(--score),#e4ece9 0);position:relative}
.score-ring:after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}.score-ring strong{position:relative;z-index:1;font-size:20px}
.rubric-list{display:grid;gap:8px}.rubric-item{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.rubric-bar{height:7px;background:#edf1f0;border-radius:99px;overflow:hidden}.rubric-bar span{display:block;height:100%;background:var(--primary-2)}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:top}.data-table th{background:#f7faf9;font-size:12px;color:#52645f;position:sticky;top:0}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700;background:#edf3f1;color:var(--primary)}
.badge.success{background:#e7f5ee;color:var(--success)}.badge.warning{background:#fff3df;color:var(--warning)}.badge.danger{background:#fdeaea;color:var(--danger)}
.list-stack{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.list-item .grow{flex:1}.list-item h4{margin:0}.list-item p{margin:4px 0 0;color:var(--muted)}
.inline-actions{display:flex;gap:7px;flex-wrap:wrap}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.pill-tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px}.pill-tab.active{background:var(--primary);color:#fff}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:24px;bottom:24px;background:#152f2a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(16px);pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:none}
dialog{border:none;padding:0;background:transparent}.modal-card{width:min(760px,92vw);background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:0;overflow:hidden}.modal-head,.modal-actions{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-actions{border-top:1px solid var(--line);border-bottom:none;justify-content:flex-end}.modal-head h3{margin:0}#modalBody{padding:20px;max-height:65vh;overflow:auto}
.mobile-only{display:none}
.report-section{page-break-inside:avoid;margin-bottom:18px}
@media(max-width:1050px){
  .app-shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;transform:translateX(105%);transition:.25s;width:300px}.sidebar.open{transform:none}
  .mobile-only{display:inline-block}.hero{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .content{padding:16px}.topbar{padding:14px 16px}.top-actions .save-state,.top-actions .ghost{display:none}
  .grid.two,.grid.three,.form-grid,.kpi-grid{grid-template-columns:1fr}.hero-stat{grid-template-columns:1fr 1fr}
  .section-title{display:block}.stage-actions{flex-direction:column}
}
@media print{
  .sidebar,.topbar,.no-print,.toast{display:none!important}.app-shell{display:block}.content{padding:0;max-width:none}
  body{background:#fff}.card{box-shadow:none;break-inside:avoid}.hero{box-shadow:none}
}

</style>

<style>
/* v2.1 bank modal */
.modal{position:fixed;inset:0;z-index:9999;background:rgba(15,35,31,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modalbox{width:min(1240px,96vw);max-height:90vh;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.25);padding:20px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:12px 0 16px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr}.modalbox{padding:12px}}
.v21-pill{display:inline-flex;align-items:center;gap:6px;background:#edf7f2;color:#245f56;border:1px solid #cfe7dc;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">أ</div>
        <div>
          <h1>أثر</h1>
          <p>بناء الاستراتيجية والأداء خطوة بخطوة</p>
        </div>
      </div>

      <div class="plan-switcher">
        <label>الخطة الحالية</label>
        <select id="planSelect"></select>
        <div class="switch-actions">
          <button class="mini-btn" id="newPlanBtn">خطة جديدة</button>
          <button class="mini-btn ghost" id="duplicatePlanBtn">نسخ</button>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-head">
          <span>اكتمال الخطة</span>
          <strong id="overallProgressText">0%</strong>
        </div>
        <div class="progress-track"><span id="overallProgressBar"></span></div>
        <small id="progressHint">ابدأ بتهيئة المنظمة</small>
      </div>

      <nav id="stageNav" class="stage-nav"></nav>

      <div class="sidebar-footer">
        <button id="exportJsonBtn" class="footer-btn">تصدير نسخة احتياطية</button>
        <label class="footer-btn file-label">
          استيراد نسخة
          <input id="importJsonInput" type="file" accept=".json" hidden />
        </label>
        <button id="printBtn" class="footer-btn ghost">طباعة التقرير</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button class="icon-btn mobile-only" id="menuBtn">☰</button>
          <span class="eyebrow">من التشخيص إلى الأثر</span>
          <h2 id="pageTitle">لوحة التحكم</h2>
        </div>
        <div class="top-actions">
          <span class="save-state" id="saveState">تم الحفظ</span>
          <button class="btn ghost" id="reviewPlanBtn">فحص الاتساق</button>
          <button class="btn primary" id="generateReportBtn">توليد التقرير</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">عنوان</h3>
        <button value="cancel" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost">إغلاق</button>
        <button id="modalConfirmBtn" value="default" class="btn primary">اعتماد</button>
      </div>
    </form>
  </dialog>

  <script>
const STORAGE_KEY = "athar_strategy_platform_v3";

const stages = [
  {id:"dashboard", group:"الرئيسية", title:"لوحة التحكم", icon:"◈"},
  {id:"organization", group:"بناء الاستراتيجية", title:"1. الجاهزية والنطاق", icon:"1"},
  {id:"beneficiary", group:"بناء الاستراتيجية", title:"2. المستفيد والقضية", icon:"2"},
  {id:"diagnosis", group:"بناء الاستراتيجية", title:"3. التشخيص المؤسسي", icon:"3"},
  {id:"environment", group:"بناء الاستراتيجية", title:"4. التحليل الاستراتيجي", icon:"4"},
  {id:"stakeholders", group:"بناء الاستراتيجية", title:"5. أصحاب المصلحة", icon:"5"},
  {id:"theory", group:"بناء الاستراتيجية", title:"6. نظرية التغيير", icon:"6"},
  {id:"identity", group:"بناء الاستراتيجية", title:"الهوية الاستراتيجية", icon:"6"},
  {id:"issues", group:"بناء الاستراتيجية", title:"القضايا والأولويات", icon:"7"},
  {id:"dimensions", group:"بناء الاستراتيجية", title:"الأبعاد الاستراتيجية", icon:"8"},
  {id:"objectives", group:"بناء الاستراتيجية", title:"الأهداف الاستراتيجية", icon:"9"},
  {id:"map", group:"بناء الاستراتيجية", title:"الخريطة الاستراتيجية", icon:"10"},
  {id:"indicators", group:"إدارة الأداء", title:"المؤشرات الاستراتيجية", icon:"11"},
  {id:"initiatives", group:"إدارة الأداء", title:"المبادرات والبرامج", icon:"12"},
  {id:"operations", group:"إدارة الأداء", title:"الخطة التشغيلية", icon:"13"},
  {id:"performance", group:"إدارة الأداء", title:"متابعة الأداء", icon:"14"},
  {id:"governance", group:"إدارة الأداء", title:"حوكمة الأداء", icon:"15"},
  {id:"report", group:"المخرجات", title:"التقرير الاستراتيجي", icon:"16"}
];

const diagnosisAxes = [
  "الهوية والتوجه","الحوكمة والامتثال","القيادة والإدارة","الموارد البشرية",
  "الاستدامة المالية","البرامج والخدمات","التقنية والبيانات","الشراكات والاتصال","التعلم والابتكار"
];

function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n));}

function newPlan(name="جمعية رعاية الأيتام بالبدائع – استراتيجية 2027–2028"){
  return {
    id:uid(), name, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    organization:{name:"جمعية رعاية الأيتام بالبدائع",type:"جمعية أهلية",sector:"رعاية وتمكين الأيتام",region:"محافظة البدائع – منطقة القصيم",beneficiaries:"الأيتام وأسرهم",employees:2,volunteers:"",budget:"",startYear:"2027",endYear:"2028",team:"",license:"1000604600",families:44,orphans:120,approver:"",dailyLead:""},
    beneficiary:{segments:[{name:"الأيتام",size:120,stage:"",needs:"",services:"مساعدات موسمية؛ كفالة يتيم؛ أكاديمية رعاية (بنين وبنات)",evidence:"بيانات الجمعية الأساسية"},{name:"الأسر المرتبطة بالمستفيدين",size:44,stage:"",needs:"",services:"سداد فواتير الخدمات للأسر المحتاجة",evidence:"بيانات الجمعية الأساسية"}],problem:{central:"",affected:"",symptoms:"",effects:"",why1:"",why2:"",why3:"",evidence:"",importance:"",influence:""},beneficiarySession:[]},
    diagnosis:Object.fromEntries(diagnosisAxes.map(a=>[a,{score:0,evidence:"",gaps:""}])),
    environment:{strengths:[],weaknesses:[],opportunities:[],threats:[],pestel:{political:"",economic:"",social:"",technological:"",environmental:"",legal:""}},
    stakeholders:[],
    theory:{problem:"",rootCauses:"",targetGroup:"",inputs:"",activities:"",outputs:"",shortOutcomes:"",midOutcomes:"",impact:"",assumptions:"",risks:""},
    identity:{purpose:"",vision:"",mission:"",values:[]},
    issues:[],
    dimensions:[],
    objectives:[],
    mapLinks:[],
    indicators:[],
    initiatives:[],
    operations:[],
    performanceUpdates:[],
    governance:{boardRole:"",executiveRole:"",strategyOfficeRole:"",reviewCycle:"ربع سنوي",approvalFlow:"",raci:[]},
    approvals:{},
    notes:{}
  };
}

let state = loadState();
let currentPlanId = state.currentPlanId || state.plans[0].id;
let currentStage = "dashboard";

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const s=JSON.parse(raw); if(s.plans?.length) return s;}
  }catch(e){}
  const p=newPlan();
  return {currentPlanId:p.id,plans:[p]};
}
function saveState(){
  state.currentPlanId=currentPlanId;
  const p=getPlan(); p.updatedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  const el=document.getElementById("saveState");
  if(el){el.textContent="تم الحفظ الآن"; setTimeout(()=>el.textContent="تم الحفظ",900);}
}
function getPlan(){return state.plans.find(p=>p.id===currentPlanId) || state.plans[0];}

function showToast(msg){
  const t=document.getElementById("toast"); t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);
}
function openModal(title,body,onConfirm=null){
  const d=document.getElementById("modal");
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  const btn=document.getElementById("modalConfirmBtn");
  btn.style.display=onConfirm?"inline-flex":"none";
  btn.onclick=(e)=>{e.preventDefault(); if(onConfirm) onConfirm(); d.close();};
  d.showModal();
}

function calculateProgress(plan){
  const checks = [
    !!plan.organization.name, !!plan.organization.sector,
    !!plan.beneficiary?.problem?.central && (plan.beneficiary?.beneficiarySession?.length||0)>=1,
    Object.values(plan.diagnosis).filter(x=>x.score>0).length>=5,
    plan.environment.strengths.length>=2 && plan.environment.weaknesses.length>=2,
    plan.stakeholders.length>=3,
    !!plan.theory.problem && !!plan.theory.impact,
    !!plan.identity.purpose && !!plan.identity.vision && !!plan.identity.mission && plan.identity.values.length>=3,
    plan.issues.length>=3, plan.dimensions.length>=3, plan.objectives.length>=3,
    plan.mapLinks.length>=2, plan.indicators.length>=3, plan.initiatives.length>=2,
    plan.operations.length>=3, plan.performanceUpdates.length>=1,
    !!plan.governance.boardRole
  ];
  return Math.round(checks.filter(Boolean).length/checks.length*100);
}

function renderShell(){
  renderPlanSelect();
  renderNav();
  const p=getPlan(), progress=calculateProgress(p);
  document.getElementById("overallProgressText").textContent=progress+"%";
  document.getElementById("overallProgressBar").style.width=progress+"%";
  document.getElementById("progressHint").textContent=progress<30?"استكمل التهيئة والتشخيص":progress<70?"انتقل لبناء الخيارات والأهداف":"اقتربت الخطة من الاكتمال";
  const stage=stages.find(s=>s.id===currentStage);
  document.getElementById("pageTitle").textContent=stage?.title||"";
}

function renderPlanSelect(){
  const sel=document.getElementById("planSelect");
  sel.innerHTML=state.plans.map(p=>`<option value="${p.id}" ${p.id===currentPlanId?"selected":""}>${escapeHtml(p.name)}</option>`).join("");
}

function isStageDone(id,p){
  const map={
    organization:!!p.organization.name&&!!p.organization.sector,
    beneficiary:!!p.beneficiary?.problem?.central&&(p.beneficiary?.beneficiarySession?.length||0)>=1,
    diagnosis:Object.values(p.diagnosis).filter(x=>x.score>0).length>=5,
    environment:p.environment.strengths.length>=2&&p.environment.weaknesses.length>=2,
    stakeholders:p.stakeholders.length>=3,
    theory:!!p.theory.problem&&!!p.theory.impact,
    identity:!!p.identity.vision&&!!p.identity.mission&&p.identity.values.length>=3,
    issues:p.issues.length>=3,dimensions:p.dimensions.length>=3,objectives:p.objectives.length>=3,
    map:p.mapLinks.length>=2,indicators:p.indicators.length>=3,initiatives:p.initiatives.length>=2,
    operations:p.operations.length>=3,performance:p.performanceUpdates.length>=1,
    governance:!!p.governance.boardRole,report:calculateProgress(p)>=70
  };
  return !!map[id];
}

function renderNav(){
  const p=getPlan(), nav=document.getElementById("stageNav");
  let currentGroup="";
  nav.innerHTML=stages.map(s=>{
    let heading="";
    if(s.group!==currentGroup){currentGroup=s.group;heading=`<div class="stage-group-title">${s.group}</div>`;}
    return heading+`<button class="stage-item ${currentStage===s.id?"active":""} ${isStageDone(s.id,p)?"done":""}" data-stage="${s.id}">
      <span class="num">${s.icon}</span><span>${s.title}</span>${isStageDone(s.id,p)?'<small>مكتمل</small>':""}
    </button>`;
  }).join("");
  nav.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{currentStage=b.dataset.stage;render();document.getElementById("sidebar").classList.remove("open");});
}

function render(){
  renderShell();
  const fn=views[currentStage]||views.dashboard;
  document.getElementById("content").innerHTML=fn(getPlan());
  bindCommon();
}

function bindCommon(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{currentStage=b.dataset.go;render();});
  document.querySelectorAll("[data-field]").forEach(el=>{
    el.addEventListener("input",()=>{
      const path=el.dataset.field.split(".");
      let obj=getPlan(); while(path.length>1)obj=obj[path.shift()];
      obj[path[0]]=el.type==="number"?Number(el.value):el.value;
      saveState(); renderShell();
    });
  });
}

function scoreText(text,type){
  const t=(text||"").trim();
  const words=t.split(/\s+/).filter(Boolean).length;
  const rubrics={
    vision:[
      ["مستقبلية",/(مجتمع|بيئة|ريادة|مستقبل|نحو|أن نكون)/,20],
      ["موجزة",words>2&&words<=18,20],
      ["ملهمة",/(مستدام|مزدهر|رائد|مُمكّن|جودة|أثر)/,20],
      ["غير تشغيلية",!/(تنفيذ|تقديم|تدريب|توزيع|إدارة)/.test(t),20],
      ["واضحة",t.length>=15,20]
    ],
    mission:[
      ["تحدد المستفيد",/(أسر|أيتام|شباب|مستفيد|مجتمع|نساء|أطفال|منظمات)/,20],
      ["تحدد القيمة",/(تمكين|رعاية|تنمية|تطوير|تحسين|تعزيز|خدمة)/,20],
      ["توضح الأسلوب",/(من خلال|عبر|بواسطة|بالشراكة)/,20],
      ["تتجه للأثر",/(أثر|استدام|جودة حياة|نتائج|تغيير)/,20],
      ["متوازنة الطول",words>=8&&words<=35,20]
    ],
    objective:[
      ["يركز على نتيجة",/(رفع|خفض|تحسين|تعزيز|زيادة|تنمية|تحقيق|تمكين)/,20],
      ["قابل للقياس",/\d|نسبة|معدل|مؤشر|مستوى/,20],
      ["محدد زمنيا",/(خلال|بحلول|سنة|سنوات|20\d\d)/,20],
      ["واضح",words>=5&&words<=30,20],
      ["غير تشغيلي",!/(عقد|تنفيذ دورة|إعداد تقرير|إنشاء اجتماع)/.test(t),20]
    ]
  };
  const rows=rubrics[type]||[];
  let score=0; const details=[];
  rows.forEach(([name,test,pts])=>{const ok=test instanceof RegExp?test.test(t):!!test;score+=ok?pts:0;details.push({name,score:ok?pts:0,max:pts});});
  return {score,details};
}

function suggestIdentity(kind,p){
  const sector=p.organization.sector||"التنمية المجتمعية";
  const ben=p.organization.beneficiaries||"الفئات المستفيدة";
  if(kind==="vision") return [
    `مجتمعٌ مُمكّن تتحقق فيه جودة الحياة المستدامة لـ${ben}.`,
    `الريادة في صناعة أثر تنموي مستدام في مجال ${sector}.`,
    `بيئة مجتمعية مزدهرة تتسع فيها فرص التمكين والاعتماد على الذات.`
  ];
  if(kind==="mission") return [
    `نُمكّن ${ben} من خلال برامج نوعية وشراكات فاعلة وحلول مستدامة تحقق أثرًا قابلًا للقياس.`,
    `نعمل على تطوير وتقديم تدخلات متكاملة في مجال ${sector} تستجيب للاحتياج وتبني قدرات المستفيدين.`,

  ];
  return [

}

  </div>`;
}

function bindArrayEditors(){
  document.querySelectorAll(".add-array").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key, placeholder=b.dataset.placeholder;
    openModal("إضافة عنصر",`<div class="field"><label>${placeholder}</label><textarea id="arrayValue" class="input"></textarea></div>`,()=>{
      const val=document.getElementById("arrayValue").value.trim(); if(!val)return;
      const p=getPlan(); const path=key.split("."); let obj=p; while(path.length>1)obj=obj[path.shift()];
      obj[path[0]].push(val);saveState();render();
    });
  });
  document.querySelectorAll(".remove-array").forEach(b=>b.onclick=()=>{
    const path=b.dataset.key.split(".");let obj=getPlan();while(path.length>1)obj=obj[path.shift()];
    obj[path[0]].splice(Number(b.dataset.index),1);saveState();render();
  });
}

<div class="list-stack">${p.performanceUpdates.map((x,i)=>`<div class="list-item"><span class="badge ${x.status==="متأخر"?"danger":x.status==="بحاجة تدخل"?"warning":"success"}">${escapeHtml(x.status)}</span><div class="grow"><h4>${escapeHtml(x.indicator)}</h4><p>الفعلي: ${escapeHtml(x.actual)} — المستهدف: ${escapeHtml(x.target)}</p><small>السبب: ${escapeHtml(x.cause)} | الإجراء: ${escapeHtml(x.action)}</small></div><button class="icon-btn delete-item" data-type="performanceUpdates" data-index="${i}">×</button></div>`).join("")||'<div class="empty">أضف أول قراءة أداء وتحليل انحراف</div>'}</div>
<div class="stage-actions"><button class="btn ghost" data-go="operations">السابق</button><button class="btn primary" data-go="governance">التالي: الحوكمة</button></div>`,
governance:p=>`<div class="section-title"><div><h3>حوكمة الاستراتيجية والأداء</h3><p>تحديد الأدوار ودورية المراجعة ومسار الاعتماد والتصعيد.</p></div><span class="badge">RACI</span></div>
<div class="card"><div class="form-grid">
${Object.entries({boardRole:"دور مجلس الإدارة",executiveRole:"دور الإدارة التنفيذية",strategyOfficeRole:"دور مكتب الاستراتيجية والأداء",approvalFlow:"مسار الاعتماد والتصعيد"}).map(([k,l])=>`<div class="field"><label>${l}</label><textarea class="input" data-field="governance.${k}">${escapeHtml(p.governance[k])}</textarea></div>`).join("")}
<div class="field"><label>دورية مراجعة الأداء</label><select class="input" data-field="governance.reviewCycle">${["شهري","ربع سنوي","نصف سنوي","سنوي"].map(x=>`<option ${p.governance.reviewCycle===x?"selected":""}>${x}</option>`).join("")}</select></div>

function buildReport(p){
  return `<div class="section-title no-print"><div><h3>التقرير الاستراتيجي المتكامل</h3><p>ملخص مترابط لجميع مكونات الخطة.</p></div><button class="btn primary" onclick="window.print()">طباعة / حفظ PDF</button></div>
  <section class="hero report-section"><div><span class="eyebrow" style="color:#d7c08c">الخطة الاستراتيجية</span><h3>${escapeHtml(p.organization.name||p.name)}</h3><p>${escapeHtml(p.organization.startYear)}–${escapeHtml(p.organization.endYear)} | ${escapeHtml(p.organization.sector)}</p></div><div class="hero-stat"><div class="stat-box"><small>الأهداف</small><strong>${p.objectives.length}</strong></div><div class="stat-box"><small>المؤشرات</small><strong>${p.indicators.length}</strong></div></div></section>
  ${[
    ["الغاية",p.identity.purpose],["الرؤية",p.identity.vision],["الرسالة",p.identity.mission]
  ].map(([t,v])=>`<div class="card report-section"><h3>${t}</h3><p>${escapeHtml(v)||"—"}</p></div>`).join("")}
  <div class="card report-section"><h3>القيم</h3><div class="grid three">${p.identity.values.map(v=>`<div><strong>${escapeHtml(v.name)}</strong><p>${escapeHtml(v.definition)}</p></div>`).join("")||"—"}</div></div>
  <div class="card report-section"><h3>القضايا الاستراتيجية</h3><ol>${p.issues.map(x=>`<li><strong>${escapeHtml(x.title)}</strong> — ${escapeHtml(x.description)}</li>`).join("")||"<li>—</li>"}</ol></div>
  <div class="card report-section"><h3>الأبعاد والأهداف</h3>${p.dimensions.map(d=>`<h4>${escapeHtml(d.name)}</h4><ul>${p.objectives.filter(o=>o.dimension===d.name).map(o=>`<li>${escapeHtml(o.title)}</li>`).join("")||"<li>لا توجد أهداف مرتبطة</li>"}</ul>`).join("")||"—"}</div>
  <div class="card report-section"><h3>المؤشرات الاستراتيجية</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>المؤشر</th><th>الهدف</th><th>الخط الأساسي</th><th>المستهدف</th></tr></thead><tbody>${p.indicators.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.objective)}</td><td>${escapeHtml(x.baseline)}</td><td>${escapeHtml(x.target)}</td></tr>`).join("")||"<tr><td colspan='4'>—</td></tr>"}</tbody></table></div></div>
  <div class="card report-section"><h3>المبادرات</h3><ol>${p.initiatives.map(x=>`<li><strong>${escapeHtml(x.name)}</strong> — ${escapeHtml(x.description)}</li>`).join("")||"<li>—</li>"}</ol></div>`;
}

function bindBeneficiaryFields(){
  document.querySelectorAll(".problem-field").forEach(el=>el.oninput=()=>{getPlan().beneficiary.problem[el.dataset.k]=el.value;saveState();renderShell();});
  document.querySelectorAll(".ben-seg").forEach(el=>el.oninput=()=>{getPlan().beneficiary.segments[Number(el.dataset.i)][el.dataset.k]=el.value;saveState();});
  document.querySelectorAll(".ben-session").forEach(el=>el.oninput=()=>{const i=Number(el.dataset.i);while(getPlan().beneficiary.beneficiarySession.length<=i)getPlan().beneficiary.beneficiarySession.push({summary:""});getPlan().beneficiary.beneficiarySession[i].summary=el.value;saveState();renderShell();});
}

function bindDynamic(){
  bindBeneficiaryFields();
  bindArrayEditors();
  document.querySelectorAll(".diag-range").forEach(el=>el.oninput=()=>{getPlan().diagnosis[el.dataset.axis].score=Number(el.value);saveState();render();});
  document.querySelectorAll(".diag-field").forEach(el=>el.oninput=()=>{getPlan().diagnosis[el.dataset.axis][el.dataset.prop]=el.value;saveState();});
  document.querySelectorAll(".delete-item").forEach(b=>b.onclick=()=>{
    const p=getPlan(),type=b.dataset.type,i=Number(b.dataset.index);
    if(type==="values")p.identity.values.splice(i,1);else p[type].splice(i,1);saveState();render();
  });
  document.querySelectorAll(".suggest-identity").forEach(b=>b.onclick=()=>{
    const kind=b.dataset.kind,opts=suggestIdentity(kind,getPlan());
    openModal("مقترحات صياغة",`<div class="list-stack">${opts.map((o,i)=>`<label class="list-item"><input type="radio" name="sugg" value="${i}" ${i===0?"checked":""}><div class="grow">${escapeHtml(o)}</div></label>`).join("")}</div>`,()=>{
      const i=Number(document.querySelector('input[name="sugg"]:checked')?.value||0);getPlan().identity[kind]=opts[i];saveState();render();
    });
  });
  const addHandlers={
    addStakeholderBtn:()=>openModal("إضافة صاحب مصلحة",formHtml([
      ["name","اسم الطرف","text"],["influence","درجة التأثير 1–5","number"],["interest","درجة الاهتمام 1–5","number"],["need","الاحتياج أو التوقع","text"],["strategy","استراتيجية التعامل","text"]
    ]),()=>pushFromForm("stakeholders",["name","influence","interest","need","strategy"])),
    addValueBtn:()=>openModal("إضافة قيمة",formHtml([["name","اسم القيمة","text"],["definition","تعريف القيمة","text"],["behaviors","السلوكيات الدالة عليها","text"]]),()=>{const o=readForm(["name","definition","behaviors"]);getPlan().identity.values.push(o);saveState();render();}),
    addIssueBtn:()=>openModal("إضافة قضية استراتيجية",formHtml([["title","عنوان القضية","text"],["description","وصف القضية","text"],["impact","الأثر 1–5","number"],["urgency","الاستعجال 1–5","number"],["capability","قدرة المنظمة 1–5","number"]]),()=>{let o=readForm(["title","description","impact","urgency","capability"]);o.priority=Math.round((Number(o.impact)+Number(o.urgency)+Number(o.capability))/15*100);getPlan().issues.push(o);saveState();render();}),
    addDimensionBtn:()=>openModal("إضافة بُعد",formHtml([["name","اسم البعد","text"],["description","وصف البعد","text"]]),()=>pushFromForm("dimensions",["name","description"])),
    addObjectiveBtn:()=>openModal("إضافة هدف استراتيجي",formHtml([["title","صياغة الهدف","text"],["description","الوصف والمبرر","text"],["dimension","البعد","text"],["issue","القضية المرتبطة","text"],["owner","مالك الهدف","text"],["baseline","خط الأساس","text"],["target","المستهدف النهائي","text"]]),()=>pushFromForm("objectives",["title","description","dimension","issue","owner","baseline","target"])),
    addMapLinkBtn:()=>openModal("إضافة علاقة سببية",formHtml([["from","الهدف المؤثر","text"],["to","الهدف المتأثر","text"],["rationale","مبرر العلاقة","text"]]),()=>pushFromForm("mapLinks",["from","to","rationale"])),

function formHtml(fields){return `<div class="form-grid">${fields.map(([id,label,type])=>`<div class="field ${id==="description"?"full":""}"><label>${label}</label><input id="f_${id}" class="input" type="${type||"text"}"></div>`).join("")}</div>`;}
function readForm(keys){return Object.fromEntries(keys.map(k=>[k,document.getElementById("f_"+k)?.value||""]));}
function pushFromForm(type,keys){getPlan()[type].push(readForm(keys));saveState();render();}

const originalRender=render;

document.getElementById("planSelect").onchange=e=>{currentPlanId=e.target.value;currentStage="dashboard";render();};
document.getElementById("newPlanBtn").onclick=()=>{

  });
};
document.getElementById("duplicatePlanBtn").onclick=()=>{

};

document.getElementById("exportJsonBtn").onclick=()=>{

};
document.getElementById("importJsonInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.plans?.length)throw Error();state=s;currentPlanId=s.currentPlanId||s.plans[0].id;saveState();render();showToast("تم استيراد النسخة بنجاح");}catch(_){showToast("الملف غير صالح");}};r.readAsText(f);
};
document.getElementById("reviewPlanBtn").onclick=()=>{
  const p=getPlan(),issues=[];
  if(!p.identity.vision)issues.push("الرؤية غير مكتملة");
  if(!p.identity.mission)issues.push("الرسالة غير مكتملة");
  if(p.objectives.length<3)issues.push("عدد الأهداف الاستراتيجية قليل");
  if(p.indicators.length<p.objectives.length)issues.push("بعض الأهداف لا يقابلها مؤشر");
  p.objectives.forEach(o=>{if(!p.indicators.some(i=>i.objective===o.title))issues.push(`الهدف «${o.title}» بلا مؤشر مطابق`);});
  p.initiatives.forEach(i=>{if(!p.objectives.some(o=>o.title===i.objective))issues.push(`المبادرة «${i.name}» غير مرتبطة بهدف مطابق`);});
  openModal("نتيجة فحص الاتساق",issues.length?`<div class="list-stack">${issues.map(x=>`<div class="list-item"><span class="badge warning">تنبيه</span><div>${escapeHtml(x)}</div></div>`).join("")}</div>`:`<div class="callout success">لم تُكتشف تعارضات أساسية. استمر في المراجعة البشرية والاعتماد المؤسسي.</div>`);
};

render();

</script>

 return `<div class="section-head"><div><h3>13. خارطة الطريق والخطة التشغيلية</h3><p class="muted">مطابقة لأ13: التبعيات، المعالم، الموازنة والتمويل، ثم تفصيل السنة الأولى.</p></div><button class="btn ghost" id="syncRoadmapV2">تحديث من المبادرات</button></div>${legend()}
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>المبادرة</th><th>مرحلة/سنة</th><th>ربع/شهر</th><th>البداية</th><th>النهاية</th><th>ما الذي يجب أن يسبقها؟</th><th>المعلم الرئيس</th><th>النتيجة المرحلية</th><th>الموازنة</th><th>مصدر التمويل</th><th>المالك</th><th>الشريك</th><th>الجاهزية</th><th>حالة القرار</th><th>سبب التوقيت</th></tr></thead><tbody>${rows||`<tr><td colspan="15" class="empty">اعتمد مبادرات أولًا.</td></tr>`}</tbody></table></div></div>
 <div class="card"><div class="section-head"><h3>السنة الأولى – تفصيل التنفيذ</h3><button class="btn primary" id="addYear1">+ مهمة/حزمة</button></div><div class="tablewrap"><table class="table"><thead><tr><th>المبادرة</th><th>المهمة/الحزمة</th><th>المسؤول</th><th>البداية</th><th>النهاية</th><th>المخرج</th><th>مؤشر الإنجاز</th><th>المورد/الميزانية</th><th>الاعتماد المطلوب</th><th>الحالة</th><th></th></tr></thead><tbody>${y||`<tr><td colspan="11" class="empty">أضف تفاصيل السنة الأولى.</td></tr>`}</tbody></table></div></div>`;
};

/* أ14 */
governance=function(){

 let ll=x.learningLog.map((r,i)=>`<tr><td><textarea class="role-team" data-llv2="${i}:event">${esc(r.event)}</textarea></td><td><textarea class="role-team" data-llv2="${i}:learning">${esc(r.learning)}</textarea></td><td><select class="role-asked" data-llv2="${i}:decision">${["","استمرار","تعديل","توسع","إيقاف"].map(v=>`<option ${v===r.decision?"selected":""}>${v}</option>`).join("")}</select></td><td><input class="role-org" data-llv2="${i}:approver" value="${esc(r.approver)}"></td><td><input type="date" class="role-team" data-llv2="${i}:date" value="${esc(r.date)}"></td><td><input class="role-team" data-llv2="${i}:version" value="${esc(r.version)}"></td><td><button class="btn danger" data-lldelv2="${i}">حذف</button></td></tr>`).join("");
 return `<div class="section-head"><div><h3>14. RACI وحوكمة الأداء والتعلم</h3><p class="muted">مطابقة لأ14: المسؤوليات، صلاحيات المجلس والإدارة، إيقاع المراجعة، التصعيد، وسجل التعلم.</p></div><button class="btn primary" id="addRaci">+ عنصر RACI</button></div>${legend()}
 <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>العنصر/الهدف/المبادرة</th><th>R منفذ</th><th>A مسؤول نهائي</th><th>C مستشار</th><th>I يُبلغ</th><th>قرار لا يملكه إلا المجلس</th><th>قرار تفوضه الإدارة</th><th>إيقاع المتابعة</th><th>حد التصعيد</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="11" class="empty">أضف عناصر الحوكمة.</td></tr>`}</tbody></table></div></div>
 <div class="card"><h3>نظام مراجعة الأداء</h3><div class="tablewrap"><table class="table"><tbody>${pr}</tbody></table></div></div>
 <div class="card"><div class="section-head"><h3>سجل التعلم</h3><button class="btn ghost" id="addLearning">+ درس/تغيير</button></div><div class="tablewrap"><table class="table"><thead><tr><th>الدليل/الحدث</th><th>ما تعلمناه</th><th>القرار</th><th>الموافق</th><th>تاريخ النفاذ</th><th>النسخة الجديدة</th><th></th></tr></thead><tbody>${ll||`<tr><td colspan="7" class="empty">يسجل بعد بدء التنفيذ.</td></tr>`}</tbody></table></div></div>`;
};

renders.kpis=kpis;renders.initiatives=initiatives;renders.roadmap=roadmap;renders.governance=governance;

 bindArr("[data-inv2]","inv2",()=>p().initiatives);

 bindArr("[data-y1v2]","y1v2",()=>p().year1Tasks);
 bindArr("[data-rav2]","rav2",()=>p().raci);
 bindArr("[data-prv2]","prv2",()=>p().performanceReview);
 bindArr("[data-llv2]","llv2",()=>p().learningLog);
 if(document.getElementById("syncRoadmapV2"))document.getElementById("syncRoadmapV2").onclick=()=>{p().initiatives.filter(i=>["اعتماد","اعتماد مشروط"].includes(i.decision)).forEach(i=>{if(!p().roadmap.some(r=>r.initiative===i.name))p().roadmap.push({initiative:i.name,phase:"",period:"",start:"",end:"",predecessor:i.dependencies||"",milestone:"",interim:"",budget:"",funding:"",owner:i.owner||"",partner:i.partner||"",readiness:"",decision:"",timingReason:""})});save();render()};
 if(document.getElementById("addYear1"))document.getElementById("addYear1").onclick=()=>{p().year1Tasks.push({initiative:"",task:"",owner:"",start:"",end:"",output:"",indicator:"",resource:"",approval:"",status:"لم يبدأ"});save();render()};
 document.querySelectorAll("[data-y1delv2]").forEach(b=>b.onclick=()=>{p().year1Tasks.splice(Number(b.dataset.y1delv2),1);save();render()});
 if(document.getElementById("addLearning"))document.getElementById("addLearning").onclick=()=>{p().learningLog.push({event:"",learning:"",decision:"",approver:"",date:"",version:""});save();render()};
 document.querySelectorAll("[data-lldelv2]").forEach(b=>b.onclick=()=>{p().learningLog.splice(Number(b.dataset.lldelv2),1);save();render()});
};

<script>
/* ===== أثر v2.1 — بنك أفكار PESTEL + مصفوفة SWOT/TOWS تلقائية ===== */
const pestelBankV21 = {
 "سياسي/تنظيمي":["تحديثات الأنظمة واللوائح المنظمة للقطاع غير الربحي","متطلبات الحوكمة والامتثال والإفصاح","تنظيمات جمع التبرعات واستقبال التبرعات إلكترونيًا","اشتراطات حماية المستفيد وحقوقه","البرامج الحكومية الداعمة للقطاع غير الربحي","فرص التكامل مع الجهات الحكومية المحلية","التغير في سياسات التمويل والمنح الحكومية","متطلبات التراخيص والتصاريح للبرامج والفعاليات"],
 "اقتصادي":["ارتفاع تكاليف التشغيل والخدمات","تذبذب القدرة الشرائية للأسر المستفيدة","تغير حجم التبرعات الفردية","اشتداد المنافسة على المنح المؤسسية","فرص المسؤولية الاجتماعية للشركات","توسع منتجات الوقف والاستثمار الاجتماعي","ارتفاع تكلفة استقطاب الكفاءات","فرص التمويل المشترك والتحالفات التمويلية"],
 "اجتماعي":["تغير احتياجات الأيتام باختلاف المراحل العمرية","ارتفاع توقعات المستفيدين لجودة وسرعة الخدمة","الحساسية تجاه الخصوصية والكرامة في تقديم الخدمة","وجود وصمة اجتماعية لدى بعض الأسر","ارتفاع اهتمام المجتمع بقضايا التمكين لا الإعانة فقط","تزايد فرص التطوع المجتمعي والمهني","تغير أنماط الأسرة والدعم الاجتماعي","الحاجة المتزايدة للدعم النفسي والاجتماعي والتربوي"],
 "تقني":["توسع المنصات الرقمية للتبرع والخدمات","إمكان استخدام أنظمة إدارة المستفيدين CRM","تطور أدوات تحليل البيانات والذكاء الاصطناعي","ارتفاع أهمية الأمن السيبراني وحماية البيانات","إمكان تقديم بعض الخدمات عن بعد","توسع التعليم والتدريب الإلكتروني","الحاجة إلى تكامل البيانات بين الأنظمة","فرص أتمتة الإجراءات والمتابعة والتقارير"],
 "بيئي/مكاني":["تباعد بعض المستفيدين جغرافيًا وصعوبة الوصول","الحاجة لخدمات متنقلة أو لامركزية","تأثر بعض الأنشطة بالظروف المناخية والموسمية","اختلاف كثافة الخدمات بين المدن والمراكز","فرص الشراكة مع مرافق مجتمعية قائمة","الحاجة إلى تخطيط مواقع تقديم الخدمة","تأثير النقل والمواصلات على وصول المستفيد","تفاوت البنية التحتية الرقمية بين المستفيدين"],
 "قانوني":["متطلبات حماية البيانات والخصوصية","الالتزامات التعاقدية مع الموظفين والموردين","اشتراطات الموافقات على استخدام الصور والقصص","الالتزام بالأنظمة المالية والمحاسبية","الاشتراطات النظامية للوقف والاستثمار","متطلبات التوثيق والعقود مع الشركاء","الضوابط النظامية للتطوع","مخاطر المسؤولية القانونية في الخدمات التخصصية"]
};
function ensurePestelBankState(){const x=p();x.pestelBankFilters=x.pestelBankFilters||{dimension:'الكل',type:'الكل',q:''};}
ensurePestelBankState();
function inferPestelType(text){const threatWords=['مخاطر','ارتفاع','تذبذب','اشتداد','حساسية','صعوبة','تأثر','الالتزامات','الضوابط','ضعف','تغير حجم','وصمة'];return threatWords.some(w=>String(text).includes(w))?'تهديد':'فرصة';}
function pestelBankModal(){ensurePestelBankState();const f=p().pestelBankFilters;let items=[];Object.entries(pestelBankV21).forEach(([d,arr])=>arr.forEach(text=>items.push({dimension:d,text,type:inferPestelType(text)})));items=items.filter(o=>(f.dimension==='الكل'||o.dimension===f.dimension)&&(f.type==='الكل'||o.type===f.type)&&(!f.q||o.text.includes(f.q)));return `<div class="modal" id="pestelBankModal" style="display:flex"><div class="modalbox" style="max-width:1200px"><div class="section-head"><div><h2>بنك أفكار PESTEL</h2><p class="muted">أمثلة استرشادية: اختر المناسب وعدله وفق واقع الجمعية ومصدر حديث.</p></div><button class="btn ghost" id="closePestelBank">إغلاق</button></div><div class="toolbar"><input class="input" id="pestelBankSearch" placeholder="ابحث في البنك" value="${esc(f.q)}"><select class="input" id="pestelBankDim"><option>الكل</option>${Object.keys(pestelBankV21).map(d=>`<option ${d===f.dimension?'selected':''}>${d}</option>`).join('')}</select><select class="input" id="pestelBankType"><option>الكل</option><option ${f.type==='فرصة'?'selected':''}>فرصة</option><option ${f.type==='تهديد'?'selected':''}>تهديد</option></select></div><div class="grid g2" style="max-height:65vh;overflow:auto">${items.map(o=>`<div class="card" style="margin:0"><div class="small muted">${esc(o.dimension)} · ${esc(o.type)}</div><div style="font-size:1.05rem;margin:8px 0">${esc(o.text)}</div><button class="btn primary pestelBankAdd" data-d="${esc(o.dimension)}" data-t="${esc(o.type)}" data-text="${esc(o.text)}">إضافة</button></div>`).join('')}</div></div></div>`;}
const pestel_v21_prev=pestel;
pestel=function(){let out=pestel_v21_prev();out=out.replace('<button class="btn primary" id="addPestel">+ عامل</button>','<div><button class="btn primary" id="addPestel">+ عامل</button> <button class="btn ghost" id="openPestelBank">بنك أفكار PESTEL</button></div>');return out+(window.__showPestelBank?pestelBankModal():'');};
function autoTowsCandidates(){const x=p();const s=x.swot.strengths.map(r=>r.point).filter(Boolean),w=x.swot.weaknesses.map(r=>r.point).filter(Boolean),o=x.swot.opportunities.map(r=>r.point).filter(Boolean),t=x.swot.threats.map(r=>r.point).filter(Boolean);let arr=[];s.forEach(a=>o.forEach(b=>arr.push({type:'SO',internal:a,external:b,option:`استثمار «${a}» لاقتناص فرصة «${b}»`})));s.forEach(a=>t.forEach(b=>arr.push({type:'ST',internal:a,external:b,option:`توظيف «${a}» لتقليل أثر التهديد «${b}»`})));w.forEach(a=>o.forEach(b=>arr.push({type:'WO',internal:a,external:b,option:`معالجة «${a}» بالاستفادة من فرصة «${b}»`})));w.forEach(a=>t.forEach(b=>arr.push({type:'WT',internal:a,external:b,option:`تقليل «${a}» للحد من التعرض لتهديد «${b}»`})));return arr.slice(0,40);}
function autoTowsMatrixHtml(){const arr=autoTowsCandidates();return `<div class="card"><div class="section-head"><div><h3>المصفوفة التلقائية المقترحة</h3><p class="muted">تولد المنصة التقاطعات تلقائيًا من SWOT الحالي. اختر فقط العلاقات المنطقية عالية الصلة.</p></div><button class="btn ghost" id="addTopAutoTows">إضافة أعلى المقترحات</button></div><div class="grid g2">${['SO','ST','WO','WT'].map(type=>`<div class="card"><h3>${type}</h3>${arr.filter(r=>r.type===type).slice(0,5).map(r=>`<div class="callout"><b>${esc(r.option)}</b><div class="small muted" style="margin-top:6px">داخلي: ${esc(r.internal)}<br>خارجي: ${esc(r.external)}</div><button class="btn primary autoTowsAdd" data-type="${type}" data-internal="${esc(r.internal)}" data-external="${esc(r.external)}" data-option="${esc(r.option)}" style="margin-top:8px">اعتماد كمقترح</button></div>`).join('')||'<div class="empty">لا توجد نقاط كافية بعد.</div>'}</div>`).join('')}</div></div>`;}
const swot_v21_prev=swot;
swot=function(){let out=swot_v21_prev();return out+autoTowsMatrixHtml();};
const bindStage_v21_prev=bindStage;
bindStage=function(){bindStage_v21_prev();if(document.getElementById('openPestelBank'))document.getElementById('openPestelBank').onclick=()=>{window.__showPestelBank=true;render()};if(document.getElementById('closePestelBank'))document.getElementById('closePestelBank').onclick=()=>{window.__showPestelBank=false;render()};if(document.getElementById('pestelBankSearch'))document.getElementById('pestelBankSearch').oninput=e=>{p().pestelBankFilters.q=e.target.value;save();window.__showPestelBank=true;render()};if(document.getElementById('pestelBankDim'))document.getElementById('pestelBankDim').onchange=e=>{p().pestelBankFilters.dimension=e.target.value;save();window.__showPestelBank=true;render()};if(document.getElementById('pestelBankType'))document.getElementById('pestelBankType').onchange=e=>{p().pestelBankFilters.type=e.target.value;save();window.__showPestelBank=true;render()};document.querySelectorAll('.pestelBankAdd').forEach(b=>b.onclick=()=>{p().pestel.push({dimension:b.dataset.d,factor:b.dataset.text,source:'',sourceDate:'',type:b.dataset.t,likelihood:'',impact:'',horizon:'',affected:'',decision:'',response:'',confidence:'',note:'اختيار محتمل من بنك PESTEL - يلزم التحقق'});save();window.__showPestelBank=false;render()});document.querySelectorAll('.autoTowsAdd').forEach(b=>b.onclick=()=>{p().swot.tows.push({type:b.dataset.type,internal:b.dataset.internal,external:b.dataset.external,option:b.dataset.option,do:'',defer:'',evidence:'مولد تلقائيًا من SWOT - يلزم تحقق واعتماد',owner:'',move:'لا'});save();render()});if(document.getElementById('addTopAutoTows'))document.getElementById('addTopAutoTows').onclick=()=>{let arr=autoTowsCandidates();['SO','ST','WO','WT'].forEach(type=>{let r=arr.find(z=>z.type===type);if(r&&!p().swot.tows.some(z=>z.type===type&&z.internal===r.internal&&z.external===r.external))p().swot.tows.push({...r,do:'',defer:'',evidence:'مولد تلقائيًا من SWOT - يلزم تحقق واعتماد',owner:'',move:'لا'})});save();render()};};
render();
</script>

  const LAB={strengths:'نقاط القوة',weaknesses:'نقاط الضعف',opportunities:'الفرص',threats:'التهديدات',political:'السياسي والتنظيمي',economic:'الاقتصادي',social:'الاجتماعي',technological:'التقني',environmental:'البيئي والمكاني',legal:'القانوني'};
  function ensureEnv(p){
    p.environment=p.environment||{strengths:[],weaknesses:[],opportunities:[],threats:[],pestel:{}};
    ['strengths','weaknesses','opportunities','threats'].forEach(k=>p.environment[k]=Array.isArray(p.environment[k])?p.environment[k]:[]);
    p.environment.pestel=p.environment.pestel||{};
    ['political','economic','social','technological','environmental','legal'].forEach(k=>p.environment.pestel[k]=p.environment.pestel[k]||'');
    p.environment.tows=p.environment.tows||[];
  }
  function esc2(s=''){return escapeHtml(String(s));}
  function swotCard(k,p){
    const list=p.environment[k]||[];
    return `<div class="card"><div class="card-header"><h3>${LAB[k]}</h3><div><button class="btn ghost env-bank-btn" data-bank="${k}">بنك الأفكار</button> <button class="btn primary env-manual-btn" data-bank="${k}">إضافة يدويًا</button></div></div><div class="list-stack">${list.map((v,i)=>`<div class="list-item"><textarea class="input env-swot-edit" data-key="${k}" data-index="${i}">${esc2(v)}</textarea><button class="icon-btn env-swot-del" data-key="${k}" data-index="${i}">×</button></div>`).join('')||'<div class="empty">لا توجد عناصر بعد — استخدم بنك الأفكار أو أضف يدويًا.</div>'}</div></div>`;
  }
  function pestelCard(k,p){
    return `<div class="field"><div class="card-header"><label>${LAB[k]}</label><button class="btn ghost env-bank-btn" data-bank="${k}">بنك الأفكار</button></div><textarea class="input env-pestel-edit" data-key="${k}" rows="5">${esc2(p.environment.pestel[k])}</textarea></div>`;
  }
  function matrix(p){
    const E=p.environment,S=E.strengths.filter(Boolean).slice(0,6),W=E.weaknesses.filter(Boolean).slice(0,6),O=E.opportunities.filter(Boolean).slice(0,6),T=E.threats.filter(Boolean).slice(0,6);
    const build=(a,b,type,verb)=>{const out=[];a.forEach(x=>b.forEach(y=>out.push({type,x,y,text:`${verb} «${x}» مع «${y}»`})));return out.slice(0,8)};
    return {SO:build(S,O,'SO','استثمار'),ST:build(S,T,'ST','توظيف'),WO:build(W,O,'WO','معالجة'),WT:build(W,T,'WT','تقليل')};
  }
  function matrixHtml(p){
    const M=matrix(p),names={SO:'قوة + فرصة',ST:'قوة + تهديد',WO:'ضعف + فرصة',WT:'ضعف + تهديد'};
    return `<div class="card" style="margin-top:18px"><div class="section-title"><div><h3>مصفوفة استخراج التوجهات TOWS — تلقائية</h3><p>تتولد مباشرة من عناصر SWOT الحالية. اختر فقط العلاقة المنطقية، ثم عدّل صياغتها قبل الاعتماد.</p></div><span class="badge">تلقائي</span></div><div class="grid two">${Object.entries(M).map(([type,arr])=>`<div class="card"><h3>${type} — ${names[type]}</h3>${arr.length?arr.map((r,i)=>`<div class="callout"><b>${esc2(r.text)}</b><div class="small muted" style="margin-top:6px">داخلي: ${esc2(r.x)}<br>خارجي: ${esc2(r.y)}</div><button class="btn ghost env-tows-accept" data-type="${type}" data-x="${esc2(r.x)}" data-y="${esc2(r.y)}" data-text="${esc2(r.text)}" style="margin-top:8px">إضافة للتوجهات</button></div>`).join(''):'<div class="empty">أدخل عناصر SWOT ليتم التوليد تلقائيًا.</div>'}</div>`).join('')}</div></div>`;
  }
  function acceptedTowsHtml(p){
    const list=p.environment.tows||[];
    return `<div class="card" style="margin-top:18px"><div class="section-title"><div><h3>التوجهات المختارة من TOWS</h3><p>يمكن تعديل الصياغة بالكامل قبل نقلها للمفاضلة والقضايا الاستراتيجية.</p></div><span class="badge">${list.length}</span></div><div class="list-stack">${list.map((r,i)=>`<div class="list-item"><span class="badge">${esc2(r.type)}</span><div class="grow"><textarea class="input env-tows-edit" data-index="${i}">${esc2(r.text)}</textarea><small>${esc2(r.internal)} × ${esc2(r.external)}</small></div><button class="icon-btn env-tows-del" data-index="${i}">×</button></div>`).join('')||'<div class="empty">لم يتم اختيار توجهات بعد.</div>'}</div></div>`;
  }
  function openBank(k){
    const arr=(SWOT_BANK_FIX[k]||PESTEL_BANK_FIX[k]||[]);
    openModal(`بنك أفكار — ${LAB[k]}`,`<div class="field"><label>بحث</label><input id="bankSearchFix" class="input" placeholder="ابحث في البنك..."></div><div id="bankListFix" class="grid two" style="max-height:58vh;overflow:auto;margin-top:12px">${arr.map((v,i)=>`<div class="card bank-fix-item" data-text="${esc2(v)}"><p>${esc2(v)}</p><button class="btn primary bank-fix-add" data-key="${k}" data-index="${i}">إضافة</button></div>`).join('')}</div>`,null);
    const search=document.getElementById('bankSearchFix');
    if(search) search.oninput=()=>document.querySelectorAll('.bank-fix-item').forEach(c=>c.style.display=c.dataset.text.includes(search.value)?'':'none');
    document.querySelectorAll('.bank-fix-add').forEach(b=>b.onclick=()=>{
      const p=getPlan(),key=b.dataset.key,val=(SWOT_BANK_FIX[key]||PESTEL_BANK_FIX[key])[Number(b.dataset.index)];ensureEnv(p);
      if(SWOT_BANK_FIX[key]){if(!p.environment[key].includes(val))p.environment[key].push(val)}
      else {const old=p.environment.pestel[key]||'';p.environment.pestel[key]=old?old+'\n• '+val:'• '+val}
      saveState();document.getElementById('modal').close();render();
    });
  }
  views.environment=function(p){
    ensureEnv(p);
    return `<div class="section-title"><div><h3>التحليل الاستراتيجي</h3><p>تحليل البيئة الداخلية والخارجية وتحويل البيانات إلى دلالات استراتيجية.</p></div><span class="badge">SWOT + PESTEL + TOWS</span></div>
    <div class="callout"><b>طريقة العمل:</b> استخدم نتائج التشخيص المؤسسي وصوت المستفيد أولًا، ثم استخدم بنك الأفكار للمساعدة فقط، وعدّل كل عنصر وفق واقع الجمعية ودليله.</div>
    <div class="grid two">${['strengths','weaknesses','opportunities','threats'].map(k=>swotCard(k,p)).join('')}</div>
    <div class="card" style="margin-top:18px"><div class="section-title"><div><h3>تحليل PESTEL</h3><p>استخدم بنك الأفكار لكل بُعد، ثم عدّل النص وأضف ما يخص واقع الجمعية فقط.</p></div><span class="badge">بنك أفكار PESTEL</span></div><div class="form-grid">${['political','economic','social','technological','environmental','legal'].map(k=>pestelCard(k,p)).join('')}</div></div>
    ${matrixHtml(p)}${acceptedTowsHtml(p)}
    <div class="stage-actions"><button class="btn ghost" data-go="diagnosis">السابق</button><button class="btn primary" data-go="stakeholders">التالي: أصحاب المصلحة</button></div>`;
  };
  const oldBindDynamicFix=bindDynamic;
  bindDynamic=function(){
    oldBindDynamicFix();
    document.querySelectorAll('.env-bank-btn').forEach(b=>b.onclick=()=>openBank(b.dataset.bank));
    document.querySelectorAll('.env-manual-btn').forEach(b=>b.onclick=()=>{
      const v=prompt(`أضف ${LAB[b.dataset.bank]}:`);if(v){const p=getPlan();ensureEnv(p);p.environment[b.dataset.bank].push(v);saveState();render()}
    });
    document.querySelectorAll('.env-swot-edit').forEach(el=>el.oninput=()=>{const p=getPlan();ensureEnv(p);p.environment[el.dataset.key][Number(el.dataset.index)]=el.value;saveState();renderShell()});
    document.querySelectorAll('.env-swot-del').forEach(b=>b.onclick=()=>{const p=getPlan();ensureEnv(p);p.environment[b.dataset.key].splice(Number(b.dataset.index),1);saveState();render()});
    document.querySelectorAll('.env-pestel-edit').forEach(el=>el.oninput=()=>{const p=getPlan();ensureEnv(p);p.environment.pestel[el.dataset.key]=el.value;saveState();renderShell()});
    document.querySelectorAll('.env-tows-accept').forEach(b=>b.onclick=()=>{const p=getPlan();ensureEnv(p);p.environment.tows.push({type:b.dataset.type,internal:b.dataset.x,external:b.dataset.y,text:b.dataset.text});saveState();render()});
    document.querySelectorAll('.env-tows-edit').forEach(el=>el.oninput=()=>{const p=getPlan();ensureEnv(p);p.environment.tows[Number(el.dataset.index)].text=el.value;saveState()});
    document.querySelectorAll('.env-tows-del').forEach(b=>b.onclick=()=>{const p=getPlan();ensureEnv(p);p.environment.tows.splice(Number(b.dataset.index),1);saveState();render()});
  };
  const pp=getPlan();ensureEnv(pp);saveState();render();
})();

</script>

<script>
/* ===== v2.4: بنك الأسئلة والجلسات التشخيصية ===== */
const guidedBanks={
 stakeholders:[
  ["ما أهم ما تتوقعونه من الجمعية خلال فترة الخطة القادمة؟","التوقعات","مجلس الإدارة|الإدارة التنفيذية|الموظفون|المستفيدون والأسر|الشركاء|المانحون"],
  ["ما أهم احتياج أو مشكلة ترون أن الجمعية ينبغي أن تعطيها أولوية؟","الاحتياجات والقضايا","الجميع"],
  ["ما أكثر ما تقدّرونه في أداء الجمعية حاليًا ويجب المحافظة عليه؟","نقاط القوة","الجميع"],
  ["ما أكثر ما يحتاج إلى تحسين في تجربة التعامل مع الجمعية؟","الفجوات","المستفيدون والأسر|الشركاء|المانحون|الموظفون"],
  ["ما القرار أو التغيير الذي لو حدث سيصنع أكبر فرق للمستفيدين؟","الأولويات","الجميع"],
  ["ما الذي قد يمنع الجمعية من تحقيق رسالتها خلال السنوات القادمة؟","المخاطر والقضايا","مجلس الإدارة|الإدارة التنفيذية|الموظفون|الشركاء"],
  ["ما الفرص المتاحة التي ترى أن الجمعية لا تستفيد منها بما يكفي؟","الفرص","مجلس الإدارة|الإدارة التنفيذية|الشركاء|المانحون"],
  ["كيف تصفون جودة العلاقة الحالية مع الجمعية؟ وما الذي يقويها؟","العلاقة","الجميع"],
  ["ما الذي يمكن أن تقدموه للجمعية لتحقيق أثر أكبر؟","القيمة المتبادلة","الشركاء|المانحون|الموظفون|مجلس الإدارة"],
  ["ما المعلومة أو المؤشر الذي يجب أن تتابعه الجمعية لتعرف أنها تتقدم؟","القياس","مجلس الإدارة|الإدارة التنفيذية|المانحون"]
 ],
 theory:[
  ["من الفئة التي نريد أن يحدث التغيير الحقيقي في حياتها؟","الفئة المستهدفة","فريق البناء|المستفيدون والأسر"],
  ["ما المشكلة الأساسية المثبتة التي تواجه هذه الفئة؟","المشكلة","فريق البناء|المستفيدون والأسر"],
  ["لماذا تحدث هذه المشكلة؟ وما الأسباب الجذرية لا الأعراض؟","الأسباب الجذرية","فريق البناء|المستفيدون والأسر|الموظفون"],
  ["ما التغيير النهائي الذي نريد أن نراه في حياة المستفيد؟","الأثر","مجلس الإدارة|الإدارة التنفيذية|المستفيدون والأسر"],
  ["ما النتائج التي يجب أن تحدث قبل الوصول إلى هذا الأثر؟","النتائج","فريق البناء|الإدارة التنفيذية"],
  ["ما التدخلات التي يمكن أن تؤدي منطقيًا إلى هذه النتائج؟","التدخلات","فريق البناء|الإدارة التنفيذية|الموظفون"],
  ["لماذا نتوقع أن ينجح هذا التدخل؟ وما الدليل أو الخبرة التي تدعم ذلك؟","المنطق السببي","فريق البناء|الإدارة التنفيذية"],
  ["ما المخرجات المباشرة التي سنراها إذا نفذنا التدخل؟","المخرجات","فريق البناء|الموظفون"],
  ["ما الافتراضات التي يجب أن تتحقق حتى تنجح سلسلة التغيير؟","الافتراضات","فريق البناء|الإدارة التنفيذية"],
  ["ما العوامل الخارجية أو المخاطر التي قد تعطل الوصول للأثر؟","المخاطر","فريق البناء|الإدارة التنفيذية|الشركاء"]
 ],
 issues:[
  ["ما أكبر تحدٍ قد يمنع الجمعية من تحقيق رسالتها خلال فترة الخطة؟","قضية محتملة","مجلس الإدارة|الإدارة التنفيذية"],
  ["ما المشكلة التي تتكرر رغم محاولات معالجتها؟","قضية محتملة","الإدارة التنفيذية|الموظفون"],
  ["أين توجد أكبر فجوة بين الوضع الحالي والوضع الذي نريد الوصول إليه؟","فجوة استراتيجية","مجلس الإدارة|الإدارة التنفيذية|فريق البناء"],
  ["ما القضية التي إذا لم نعالجها ستؤثر بشدة على المستفيد؟","أثر المستفيد","الجميع"],
  ["ما الفرصة التي إذا لم نستثمرها الآن قد نفقدها؟","فرصة استراتيجية","مجلس الإدارة|الإدارة التنفيذية|الشركاء"],
  ["ما القضية التي تتطلب اختيارًا حقيقيًا أو تنازلًا عن شيء آخر؟","اختيار استراتيجي","مجلس الإدارة|الإدارة التنفيذية"],
  ["ما تكلفة تأجيل معالجة هذه القضية لسنة أو أكثر؟","الاستعجال","مجلس الإدارة|الإدارة التنفيذية"],
  ["إلى أي مدى تستطيع الجمعية التأثير فعليًا في هذه القضية؟","قابلية التأثير","فريق البناء|الإدارة التنفيذية"],
  ["ما الدليل الذي يثبت أن هذه قضية وليست انطباعًا؟","قوة الدليل","فريق البناء"],
  ["إذا اخترنا هذه القضية أولوية، فما الذي سنؤجله أو لن نفعله؟","المفاضلة","مجلس الإدارة|الإدارة التنفيذية"]
 ]
};
function gstate(){let x=p();x.guided=x.guided||{stakeholders:[],theory:[],issues:[]};return x.guided}
function escg(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function initGuided(k){let g=gstate(); if(!g[k]||!g[k].length) g[k]=guidedBanks[k].map((q,i)=>({q:q[0],purpose:q[1],audience:q[2],answer:'',evidence:'',importance:'',selected:true}));}
function guidedPanel(k,title){initGuided(k);let rows=gstate()[k].map((r,i)=>`<tr><td>${i+1}</td><td><textarea class="input gq" data-g="${k}:${i}:q">${escg(r.q)}</textarea><small class="muted">نبحث عن: ${escg(r.purpose)}</small></td><td><select class="input gq" data-g="${k}:${i}:audience">${['الجميع','مجلس الإدارة','الإدارة التنفيذية','الموظفون','المستفيدون والأسر','الشركاء','المانحون','فريق البناء'].map(v=>`<option ${r.audience===v?'selected':''}>${v}</option>`).join('')}<option ${!['الجميع','مجلس الإدارة','الإدارة التنفيذية','الموظفون','المستفيدون والأسر','الشركاء','المانحون','فريق البناء'].includes(r.audience)?'selected':''}>${escg(r.audience)}</option></select></td><td><textarea class="input role-asked gq" data-g="${k}:${i}:answer" placeholder="سجل خلاصة الإجابة أثناء الجلسة">${escg(r.answer)}</textarea></td><td><textarea class="input role-team gq" data-g="${k}:${i}:evidence" placeholder="دليل، مثال، وثيقة، قصة...">${escg(r.evidence)}</textarea></td><td><select class="input role-team gq" data-g="${k}:${i}:importance"><option></option>${[1,2,3,4,5].map(v=>`<option ${String(r.importance)===String(v)?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('');
return `<div class="card guided-panel"><div class="section-title"><div><h3>${title}</h3><p>أسئلة تيسير وجمع بيانات؛ يمكن تعديل السؤال وتحديد من يجيب ثم تسجيل الخلاصة والدليل.</p></div><button class="btn ghost add-guided" data-k="${k}">+ سؤال</button></div><div class="callout"><b>طريقة الاستخدام:</b> اسأل → سجل الخلاصة → أرفق الدليل → قيّم الأهمية. الإجابة لا تصبح حقيقة استراتيجية إلا بعد التحقق.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>م</th><th>السؤال والغرض</th><th>من يجيب؟</th><th>خلاصة الإجابة</th><th>الدليل/المثال</th><th>الأهمية 1-5</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function stakeholderInsights(){initGuided('stakeholders');let a=gstate().stakeholders.filter(r=>r.answer);return a.length?`<div class="card"><h3>خلاصة صوت أصحاب المصلحة</h3><div class="grid two">${a.map(r=>`<div class="callout"><b>${escg(r.purpose)}</b><br>${escg(r.answer)}${r.evidence?`<small>الدليل: ${escg(r.evidence)}</small>`:''}</div>`).join('')}</div></div>`:''}
function theoryDraft(){initGuided('theory');let a=gstate().theory;let get=p=>a.filter(r=>r.purpose===p&&r.answer).map(r=>r.answer).join('؛ ');return `<div class="card"><h3>سلسلة التغيير المستخرجة من الإجابات</h3><div class="callout"><b>الفئة:</b> ${escg(get('الفئة المستهدفة')||'—')} ← <b>المشكلة:</b> ${escg(get('المشكلة')||'—')} ← <b>الأسباب:</b> ${escg(get('الأسباب الجذرية')||'—')} ← <b>التدخل:</b> ${escg(get('التدخلات')||'—')} ← <b>النتائج:</b> ${escg(get('النتائج')||'—')} ← <b>الأثر:</b> ${escg(get('الأثر')||'—')}</div><button class="btn primary" id="applyTheoryAnswers">انعكاس الإجابات على نظرية التغيير</button></div>`}
function issueCandidates(){initGuided('issues');let q=gstate().issues.filter(r=>r.answer&&['قضية محتملة','فجوة استراتيجية','أثر المستفيد','فرصة استراتيجية','اختيار استراتيجي'].includes(r.purpose));let env=[];try{env=[...(p().environment?.weaknesses||[]),...(p().environment?.threats||[])].filter(Boolean).map(x=>({answer:typeof x==='string'?x:(x.text||x.point||''),purpose:'من SWOT',importance:4,evidence:''}))}catch(e){};return [...q,...env].filter((x,i,a)=>x.answer&&a.findIndex(y=>y.answer===x.answer)===i)}
function priorityMatrix(){let c=issueCandidates();return `<div class="card"><div class="section-title"><div><h3>القضايا المرشحة والأولوية</h3><p>مقترحات مستخرجة من الإجابات والتحليل؛ لا تعتمد تلقائيًا.</p></div><span class="badge">${c.length} مرشح</span></div><div class="grid two">${c.map((r,i)=>`<div class="callout"><b>${escg(r.answer)}</b><small>${escg(r.purpose)} ${r.evidence?'· '+escg(r.evidence):''}</small><div style="margin-top:8px"><button class="btn primary add-candidate-issue" data-text="${escg(r.answer)}">تحويل إلى قضية للتقييم</button></div></div>`).join('')||'<div class="empty">أجب عن أسئلة التشخيص أو أكمل SWOT لتظهر القضايا المرشحة.</div>'}</div></div>`}

const oldStakeV24=renders.stakeholders;
renders.stakeholders=function(x){return guidedPanel('stakeholders','بنك أسئلة أصحاب المصلحة')+stakeholderInsights()+oldStakeV24(x)};
const oldTheoryV24=renders.theory;
renders.theory=function(x){return guidedPanel('theory','أسئلة بناء نظرية التغيير')+theoryDraft()+oldTheoryV24(x)};

<script>

(function(){

        {q:'ما القرار أو التغيير الذي سيحدث أكبر فرق لها؟',purpose:'أولوية محتملة',answer:'',evidence:'',importance:5},
        {q:'ما المخاطر التي قد تمنع نجاح العلاقة مع هذه الفئة؟',purpose:'خطر/تهديد محتمل',answer:'',evidence:'',importance:3},

        {q:'كيف ستعرف هذه الفئة أن الجمعية نجحت في خدمتها أو الشراكة معها؟',purpose:'مؤشر نجاح',answer:'',evidence:'',importance:4}

        {q:'أين توجد أكبر فجوة بين الوضع الحالي والوضع الذي نريد الوصول إليه؟',purpose:'فجوة استراتيجية',answer:'',evidence:'',impact:4,urgency:4,influence:4},
        {q:'ما القضية التي إذا لم نعالجها ستؤثر بشدة على المستفيد؟',purpose:'أثر المستفيد',answer:'',evidence:'',impact:5,urgency:5,influence:4},
        {q:'ما الفرصة التي إذا لم نستثمرها الآن قد نفقدها أو تتراجع قيمتها؟',purpose:'فرصة استراتيجية',answer:'',evidence:'',impact:4,urgency:4,influence:3},
        {q:'ما القرار الكبير الذي يؤجله المجلس أو الإدارة ويحتاج حسمًا؟',purpose:'اختيار استراتيجي',answer:'',evidence:'',impact:4,urgency:4,influence:5}
      ]
    };
    saveState();
    return plan.guidedV25;
  }
  state.plans.forEach(ensureGuided);
  saveState();

  const auds=['مجلس الإدارة','الإدارة التنفيذية','الموظفون','المستفيدون/الأسر','الشركاء','المانحون','المتطوعون/المجتمع'];
  function qTable(list,key,extraCols=''){
    return `<div class="table-wrap"><table class="data-table"><thead><tr><th>السؤال</th><th>الغرض التحليلي</th><th>الإجابة/الخلاصة</th><th>الدليل/المصدر</th>${extraCols}<th></th></tr></thead><tbody>`+
      list.map((r,i)=>`<tr><td style="min-width:260px"><strong>${escapeHtml(r.q)}</strong></td><td>${escapeHtml(r.purpose)}</td><td><textarea class="input guided-v25" data-gkey="${key}" data-i="${i}" data-f="answer" placeholder="سجل الخلاصة كما قيلت…">${escapeHtml(r.answer||'')}</textarea></td><td><textarea class="input guided-v25" data-gkey="${key}" data-i="${i}" data-f="evidence" placeholder="مثال/بيان/محضر/قصة…">${escapeHtml(r.evidence||'')}</textarea></td>${key==='issueQuestions'?`<td><select class="input guided-v25" data-gkey="${key}" data-i="${i}" data-f="impact">${[1,2,3,4,5].map(v=>`<option ${Number(r.impact)===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="input guided-v25" data-gkey="${key}" data-i="${i}" data-f="urgency">${[1,2,3,4,5].map(v=>`<option ${Number(r.urgency)===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="input guided-v25" data-gkey="${key}" data-i="${i}" data-f="influence">${[1,2,3,4,5].map(v=>`<option ${Number(r.influence)===v?'selected':''}>${v}</option>`).join('')}</select></td>`:''}<td><button class="icon-btn delete-guided-v25" data-gkey="${key}" data-i="${i}">×</button></td></tr>`).join('')+
      `</tbody></table></div>`;
  }
  function guidedBadge(){return `<span class="badge" style="background:#e8f3ed;color:#184d3f;border:1px solid #c7dfd4">جديد v2.5 · جمع وتشخيص موجّه</span>`}

  views.stakeholders=function(p){
    const g=ensureGuided(p);
    return `<div class="section-title"><div><h3>أصحاب المصلحة</h3><p>ابدأ بالأسئلة الموجهة، ثم حوّل الخلاصة إلى مصفوفة أصحاب المصلحة.</p></div>${guidedBadge()}</div>
      <div class="card" style="border:2px solid #d4e7df">
        <div class="card-header"><div><h3>جلسة جمع صوت صاحب المصلحة</h3><p class="muted">اختر الفئة ثم سجل الإجابات والأدلة. لا تُطلب من المشاركين مصطلحات استراتيجية متخصصة.</p></div>
        <div style="min-width:220px"><label>الفئة التي نجمع صوتها الآن</label><select id="stakeAudienceV25" class="input">${auds.map(a=>`<option ${a===g.stakeholderAudience?'selected':''}>${a}</option>`).join('')}</select></div></div>
        ${qTable(g.stakeholderQuestions,'stakeholderQuestions')}
        <div class="inline-actions" style="margin-top:12px"><button class="btn primary" id="newStakeQuestionV25">+ سؤال مخصص</button><button class="btn ghost" id="extractStakeV25">استخراج خلاصة لصاحب المصلحة</button></div>
      </div>
      <div class="section-title" style="margin-top:24px"><div><h3>مصفوفة أصحاب المصلحة</h3><p>سجل الأطراف بعد جلسات الجمع وحدد التأثير والاهتمام والاحتياج واستراتيجية التعامل.</p></div><button class="btn primary" id="addStakeholderBtn">إضافة طرف</button></div>
      <div class="table-wrap card"><table class="data-table"><thead><tr><th>الطرف</th><th>التأثير</th><th>الاهتمام</th><th>الاحتياج</th><th>الاستراتيجية</th><th></th></tr></thead><tbody>
      ${p.stakeholders.map((x,i)=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.influence}</td><td>${x.interest}</td><td>${escapeHtml(x.need)}</td><td>${escapeHtml(x.strategy)}</td><td><button class="icon-btn delete-item" data-type="stakeholders" data-index="${i}">×</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">ابدأ بجلسات الجمع أعلاه ثم أضف أصحاب المصلحة.</div></td></tr>'}
      </tbody></table></div>
      <div class="stage-actions"><button class="btn ghost" data-go="environment">السابق</button><button class="btn primary" data-go="theory">التالي: نظرية التغيير</button></div>`;
  };

  views.theory=function(p){
    const g=ensureGuided(p);
    return `<div class="section-title"><div><h3>نظرية التغيير</h3><p>ابنها بالأسئلة أولًا، ثم حوّل الإجابات إلى السلسلة المنطقية.</p></div>${guidedBadge()}</div>
      <div class="card" style="border:2px solid #d4e7df"><div class="card-header"><div><h3>أسئلة بناء نظرية التغيير</h3><p class="muted">المشكلة ← الأسباب ← النتائج ← التدخلات ← المخرجات ← الأثر ← الافتراضات والمخاطر.</p></div><button class="btn primary" id="applyTheoryV25">تعبئة النظرية من الإجابات</button></div>
      ${qTable(g.theoryQuestions,'theoryQuestions')}
      <div class="inline-actions" style="margin-top:12px"><button class="btn ghost" id="newTheoryQuestionV25">+ سؤال مخصص</button></div></div>
      <div class="card"><h3>مسودة نظرية التغيير</h3><div class="form-grid">
      ${Object.entries({problem:'المشكلة المجتمعية',rootCauses:'الأسباب الجذرية',targetGroup:'الفئة المستهدفة',inputs:'المدخلات',activities:'التدخلات/الأنشطة',outputs:'المخرجات المباشرة',shortOutcomes:'النتائج قصيرة المدى',midOutcomes:'النتائج المتوسطة',impact:'الأثر طويل المدى',assumptions:'الافتراضات',risks:'المخاطر والعوامل الخارجية'}).map(([k,l])=>`<div class="field ${['problem','impact'].includes(k)?'full':''}"><label>${l}</label><textarea class="input" data-field="theory.${k}">${escapeHtml(p.theory[k])}</textarea></div>`).join('')}
      </div></div><div class="stage-actions"><button class="btn ghost" data-go="stakeholders">السابق</button><button class="btn primary" data-go="identity">التالي: الهوية الاستراتيجية</button></div>`;
  };

  function issueCandidatesV25(p){
    const g=ensureGuided(p); let c=[];
    g.issueQuestions.filter(r=>r.answer).forEach(r=>c.push({text:r.answer,source:r.purpose,evidence:r.evidence,impact:Number(r.impact)||3,urgency:Number(r.urgency)||3,capability:Number(r.influence)||3}));
    (p.environment?.weaknesses||[]).forEach(x=>c.push({text:typeof x==='string'?x:(x.text||x.point||''),source:'نقطة ضعف من SWOT',evidence:'SWOT',impact:4,urgency:3,capability:3}));
    (p.environment?.threats||[]).forEach(x=>c.push({text:typeof x==='string'?x:(x.text||x.point||''),source:'تهديد من SWOT',evidence:'SWOT',impact:4,urgency:4,capability:3}));
    const seen=new Set(); return c.filter(x=>x.text&&!seen.has(x.text)&&(seen.add(x.text),true));
  }

      <div class="card" style="border:2px solid #d4e7df"><div class="card-header"><div><h3>أسئلة استخراج القضايا والأولويات</h3><p class="muted">الإجابة هنا تنتج قضية مرشحة، وليست قضية معتمدة مباشرة.</p></div><button class="btn ghost" id="newIssueQuestionV25">+ سؤال مخصص</button></div>
      ${qTable(g.issueQuestions,'issueQuestions','<th>الأثر</th><th>الاستعجال</th><th>قدرة التأثير</th>')}</div>

      <div class="grid two">${cand.map((c,i)=>`<div class="callout"><strong>${escapeHtml(c.text)}</strong><small>${escapeHtml(c.source)}${c.evidence?' · '+escapeHtml(c.evidence):''}</small><div style="margin-top:8px"><button class="btn primary addIssueCandidateV25" data-i="${i}">تحويل إلى قضية للتقييم</button></div></div>`).join('')||'<div class="empty">أجب عن الأسئلة أو أكمل SWOT لتظهر القضايا المرشحة.</div>'}</div></div>

      <div class="list-stack">${p.issues.map((x,i)=>`<div class="list-item"><span class="badge ${x.priority>=80?'danger':x.priority>=55?'warning':'success'}">${x.priority}%</span><div class="grow"><h4>${escapeHtml(x.title)}</h4><p>${escapeHtml(x.description)}</p><small>الأثر: ${x.impact}/5 — الاستعجال: ${x.urgency}/5 — القدرة: ${x.capability}/5</small></div><button class="icon-btn delete-item" data-type="issues" data-index="${i}">×</button></div>`).join('')||'<div class="empty">لم تعتمد قضايا بعد.</div>'}</div>
      <div class="stage-actions"><button class="btn ghost" data-go="identity">السابق</button><button class="btn primary" data-go="dimensions">التالي: الأبعاد الاستراتيجية</button></div>`;
  };

  const bindCommonBaseV25=bindCommon;
  bindCommon=function(){
    bindCommonBaseV25();
    const p=getPlan(),g=ensureGuided(p);
    document.querySelectorAll('.guided-v25').forEach(el=>el.addEventListener('input',()=>{
      const list=g[el.dataset.gkey], row=list[Number(el.dataset.i)], f=el.dataset.f;
      row[f]=['impact','urgency','influence','importance'].includes(f)?Number(el.value):el.value; saveState();
    }));
    document.querySelectorAll('.delete-guided-v25').forEach(b=>b.onclick=()=>{g[b.dataset.gkey].splice(Number(b.dataset.i),1);saveState();render();});
    const aud=document.getElementById('stakeAudienceV25'); if(aud)aud.onchange=()=>{g.stakeholderAudience=aud.value;saveState();};
    const addQ=(key)=>{const q=prompt('اكتب السؤال الجديد:');if(q){g[key].push({q,purpose:'سؤال مخصص',answer:'',evidence:'',importance:3,impact:3,urgency:3,influence:3});saveState();render();}};
    if(document.getElementById('newStakeQuestionV25'))document.getElementById('newStakeQuestionV25').onclick=()=>addQ('stakeholderQuestions');
    if(document.getElementById('newTheoryQuestionV25'))document.getElementById('newTheoryQuestionV25').onclick=()=>addQ('theoryQuestions');
    if(document.getElementById('newIssueQuestionV25'))document.getElementById('newIssueQuestionV25').onclick=()=>addQ('issueQuestions');
    if(document.getElementById('extractStakeV25'))document.getElementById('extractStakeV25').onclick=()=>{
      const answered=g.stakeholderQuestions.filter(r=>r.answer); if(!answered.length){showToast('سجل بعض الإجابات أولًا');return;}
      const needs=answered.filter(r=>/احتياج|فجوة|عدم رضا|أولوية/.test(r.purpose)).map(r=>r.answer).join('؛ ');
      const strategy=answered.filter(r=>/فرصة|أولوية|مؤشر/.test(r.purpose)).map(r=>r.answer).join('؛ ');
      p.stakeholders.push({name:g.stakeholderAudience,influence:3,interest:4,need:needs||answered[0].answer,strategy:strategy||'إشراك ومتابعة'}); saveState(); render(); showToast('تمت إضافة خلاصة إلى مصفوفة أصحاب المصلحة');
    };
    if(document.getElementById('applyTheoryV25'))document.getElementById('applyTheoryV25').onclick=()=>{
      const by=purpose=>g.theoryQuestions.filter(r=>r.purpose===purpose&&r.answer).map(r=>r.answer).join('؛ ');
      p.theory.targetGroup=by('الفئة المستهدفة')||p.theory.targetGroup;
      p.theory.problem=by('المشكلة')||p.theory.problem;
      p.theory.rootCauses=by('الأسباب الجذرية')||p.theory.rootCauses;
      p.theory.activities=by('التدخلات')||p.theory.activities;
      p.theory.outputs=by('المخرجات')||p.theory.outputs;
      p.theory.shortOutcomes=by('النتائج')||p.theory.shortOutcomes;
      p.theory.impact=by('الأثر')||p.theory.impact;
      p.theory.assumptions=by('الافتراضات')||p.theory.assumptions;
      p.theory.risks=by('المخاطر')||p.theory.risks;
      saveState();render();showToast('تمت تعبئة مسودة نظرية التغيير من الإجابات');
    };
    const candidates=issueCandidatesV25(p);
    document.querySelectorAll('.addIssueCandidateV25').forEach(b=>b.onclick=()=>{
      const c=candidates[Number(b.dataset.i)]; if(!c)return;
      const pr=Math.round((c.impact+c.urgency+c.capability)/15*100);
      if(!p.issues.some(x=>x.title===c.text))p.issues.push({title:c.text,description:`مرشحة من: ${c.source}${c.evidence?' | الدليل: '+c.evidence:''}`,impact:c.impact,urgency:c.urgency,capability:c.capability,priority:pr});
      saveState();render();showToast('أضيفت القضية للتقييم');
    });
  };
  render();
})();
</script>
